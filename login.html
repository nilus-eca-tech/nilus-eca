<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - نيلوس إيكا</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #219653; }
        .link { margin-top: 15px; display: block; font-size: 14px; color: #2980b9; text-decoration: none; cursor: pointer; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>تسجيل الدخول</h2>
    <form action="/api/auth/login" method="POST">
        <div class="form-group">
            <label for="username">اسم المستخدم أو البريد الإلكتروني:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">دخول للمنظومة</button>
    </form>
    <!-- رابط للذهاب لصفحة إنشاء حساب جديد -->
    <a href="register.html" class="link">ليس لديك حساب؟ إنشاء حساب جديد</a>
</div>

</body>
</html>
