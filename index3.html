<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة ايكا نيلوس للتقنيات الرقمية وأصول المناخ | Nilus ECA</title>
    <!-- تضمين مكتبة الخرائط Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1b4d3e; font-size: 24px; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        #map { height: 400px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ccc; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #1b4d3e; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #14382c; }
        .results-box { background: #eef2f1; padding: 15px; border-radius: 8px; margin-top: 20px; border-right: 4px solid #1b4d3e; }
    </style>
</head>
<body>

<div class="container">
    <h1>نيلوس للتقنيات الرقمية وأصول المناخ (Nilus ECA)</h1>
    <p>منظومة تحليل أراضي الكربون الذكية وتوصيات الاستشعار عن بعد (Sentinel-2 & IoT)</p>

    <div class="form-group">
        <label>حدد موقع وحقول الحقل الجغرافي على الخريطة:</label>
        <div id="map"></div>
    </div>

    <div class="form-group">
        <label for="fieldName">اسم الحقل أو المشروع:</label>
        <input type="text" id="fieldName" placeholder="مثال: حقل المنيا النموذجي 1">
    </div>

    <button onclick="analyzeField()">بدء التحليل الفضائي وتقدير الكربون</button>
    <button style="background: #27ae60;" onclick="requestPaidReport()">طلب التقرير الذكي المدفوع للفلاح</button>

    <div id="results" class="results-box" style="display:none;">
        <h3>نتائج التحليل والأصول السحابية:</h3>
        <pre id="outputData"></pre>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // تهيئة الخريطة (مركز مصر / المنيا افتراضياً)
    const map = L.map('map').setView([28.1099, 30.7503], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = L.marker([28.1099, 30.7503], { draggable: true }).addTo(map);
    marker.on('dragend', function(e) {
        const coords = e.target.getLatLng();
        console.log("الإحداثيات المحددة:", coords.lat, coords.lng);
    });

    async function analyzeField() {
        const fieldName = document.getElementById('fieldName').value;
        const pos = marker.getLatLng();

        if (!fieldName) {
            alert('يرجى إدخال اسم الحقل أولاً.');
            return;
        }

        const payload = {
            fieldName,
            coordinates: { lat: pos.lat, lng: pos.lng },
            farmerId: "Farmer_Minya_01"
        };

        try {
            const response = await fetch('http://localhost:3001/api/analyze-field', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (response.ok) {
                document.getElementById('results').style.display = 'block';
                document.getElementById('outputData').textContent = JSON.stringify(result, null, 2);
            } else {
                alert('خطأ: ' + result.error);
            }
        } catch (err) {
            alert('تعذر الاتصال بالخادم الخلفي.');
            console.error(err);
        }
    }

    async function requestPaidReport() {
        const fieldName = document.getElementById('fieldName').value || 'حقل غير مسمى';
        
        const payload = {
            farmerName: "مستفيد محلي",
            nationalId: "29900000000000",
            fieldAreaAcres: 5.5,
            paymentReference: "PAY_SIM_98765"
        };

        try {
            const response = await fetch('http://localhost:3001/api/paid-farmer-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (response.ok) {
                document.getElementById('results').style.display = 'block';
                document.getElementById('outputData').textContent = JSON.stringify(result, null, 2);
            } else {
                alert('خطأ: ' + result.error);
            }
        } catch (err) {
            alert('تعذر الاتصال ببرمجيات الإصدار المدفوع.');
        }
    }
</script>

</body>
</html>
