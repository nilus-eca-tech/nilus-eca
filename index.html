    function initMap() {
        const initialLat = 28.1099;
        const initialLng = 30.7503;

        map = L.map('map').setView([initialLat, initialLng], 13);

        // طبقة القمر الصناعي القياسية عالية الدقة
        const baseSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        // طبقة القمر الصناعي الحقيقي المحدثة بدقة فائقة (عالية التباين للأراضي الزراعية)
        const realSatelliteHD = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Esri High-Definition Agriculture Layer'
        });

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        baseSatellite.addTo(map);

        const baseMaps = {
            "🛰️ القمر الصناعي الأساسي": baseSatellite,
            "🛰️ القمر الصناعي الحقيقي (عالي الدقة)": realSatelliteHD,
            "🗺️ الخريطة القياسية (OSM)": osmLayer
        };
        L.control.layers(baseMaps).addTo(map);

        marker = L.marker([initialLat, initialLng], { draggable: true }).addTo(map);

        marker.on('dragend', function() {
            const pos = marker.getLatLng();
            document.getElementById('gpsLat').value = pos.lat.toFixed(4);
            document.getElementById('gpsLng').value = pos.lng.toFixed(4);
            updateDynamicFieldMetrics(pos.lat, pos.lng);
            showToast(currentLang === 'ar' ? '✅ تم تحديث إحداثيات موقع الأرض' : '✅ GPS coordinates updated', 'success');
        });

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            document.getElementById('gpsLat').value = e.latlng.lat.toFixed(4);
            document.getElementById('gpsLng').value = e.latlng.lng.toFixed(4);
            updateDynamicFieldMetrics(e.latlng.lat, e.latlng.lng);
            showToast(currentLang === 'ar' ? '✅ تم تحديد نقطة الرصد النباتي بنجاح' : '✅ Monitoring point set successfully', 'success');
        });
    }

    window.onload = function() {
        initMap();
    };

    function updateDynamicFieldMetrics(lat, lng) {
        const syntheticNdvi = (0.35 + (Math.abs(Math.sin(lat * lng)) * 0.55)).toFixed(2);
        const syntheticMoisture = (35 + (Math.abs(Math.cos(lat)) * 30)).toFixed(1);
        const syntheticCarbon = (parseFloat(syntheticNdvi) * 18.5).toFixed(1);

        document.getElementById('card1Value').innerText = syntheticNdvi;
        document.getElementById('card2Value').innerText = syntheticMoisture + '%';
        document.getElementById('card3Value').innerText = syntheticCarbon;
        document.getElementById('soilMoisture').value = syntheticMoisture;
        document.getElementById('ndviInput').value = syntheticNdvi;

        const card1Status = document.getElementById('card1Status');
        if (syntheticNdvi > 0.6) {
            card1Status.className = "bg-emerald-500/20 text-emerald-400 text-[11px] font-bold px-2 py-0.5 rounded-lg";
            card1Status.innerText = currentLang === 'ar' ? 'نمو ممتاز' : 'Optimal Growth';
        } else {
            card1Status.className = "bg-amber-500/20 text-amber-400 text-[11px] font-bold px-2 py-0.5 rounded-lg";
            card1Status.innerText = currentLang === 'ar' ? 'يحتاج مراقبة' : 'Needs Monitoring';
        }
    }

    function toggleNDVILayer() {
        isNdviActive = !isNdviActive;
        const container = document.getElementById('mapContainer');
        const btnText = document.getElementById('ndviBtnText');

        if (isNdviActive) {
            container.classList.add('ndvi-active');
            btnText.innerText = currentLang === 'ar' ? 'إخفاء طبقة الغطاء النباتي (NDVI)' : 'Hide NDVI Vegetation Layer';
            showToast(currentLang === 'ar' ? '🌱 تم تفعيل طبقة الغطاء النباتي الفعلي بنجاح' : '🌱 NDVI layer activated', 'success');
        } else {
            container.classList.remove('ndvi-active');
            btnText.innerText = currentLang === 'ar' ? 'تفعيل طبقة الغطاء النباتي الفعلي (NDVI)' : 'Enable NDVI Vegetation Layer';
            showToast(currentLang === 'ar' ? 'تم إخفاء طبقة الغطاء النباتي' : 'NDVI layer hidden', 'success');
        }
    }

    function captureMapSnapshot() {
        const mapElement = document.getElementById('mapContainer');
        showToast(currentLang === 'ar' ? '⏳ جاري التقاط الصورة التوثيقية للخريطة النباتية...' : '⏳ Capturing map snapshot...', 'info');
        
        html2canvas(mapElement, { useCORS: true, allowTaint: true }).then(canvas => {
            capturedMapImage = canvas.toDataURL('image/png');
            const container = document.getElementById('snapshotImageContainer');
            container.innerHTML = `<img src="${capturedMapImage}" class="max-h-48 rounded-lg border border-cyan-500/30 shadow-lg">`;
            document.getElementById('snapshotPreviewArea').classList.remove('hidden');
            showToast(currentLang === 'ar' ? '📸 تم التقاط وحفظ الصورة التوثيقية بنجاح' : '📸 Snapshot captured successfully', 'success');
        }).catch(err => {
            showToast(currentLang === 'ar' ? '❌ فشل التقاط الصورة' : '❌ Failed to capture snapshot', 'error');
        });
    }

    function clearSnapshot() {
        capturedMapImage = null;
        document.getElementById('snapshotImageContainer').innerHTML = '';
        document.getElementById('snapshotPreviewArea').classList.add('hidden');
        showToast(currentLang === 'ar' ? '🗑️ تم حذف الصورة التوثيقية' : '🗑️ Snapshot deleted', 'info');
    }

    function getCurrentGPS() {
        if (navigator.geolocation) {
            showToast(currentLang === 'ar' ? '📍 جاري تحديد موقعك الفعلي عبر الأقمار...' : '📍 Fetching GPS location...', 'info');
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                document.getElementById('gpsLat').value = lat.toFixed(4);
                document.getElementById('gpsLng').value = lng.toFixed(4);
                map.setView([lat, lng], 15);
                marker.setLatLng([lat, lng]);
                updateDynamicFieldMetrics(lat, lng);
                showToast(currentLang === 'ar' ? '✅ تم تحديث الإحداثيات لموقعك الحالي' : '✅ Location updated to current GPS', 'success');
            }, error => {
                showToast(currentLang === 'ar' ? '❌ تعذر تحديد الموقع، يرجى تفعيل GPS' : '❌ Failed to get location', 'error');
            });
        } else {
            showToast(currentLang === 'ar' ? '❌ المتصفح لا يدعم تحديد الموقع الجغرافي' : '❌ Geolocation not supported', 'error');
        }
    }

    function fetchSentinelData() {
        showToast(currentLang === 'ar' ? '🛰️ يتم تحديث وتحميل أحدث نطاقات قمر Sentinel-2...' : '🛰️ Fetching latest Sentinel-2 bands...', 'info');
        setTimeout(() => {
            const lat = parseFloat(document.getElementById('gpsLat').value) || 28.1099;
            const lng = parseFloat(document.getElementById('gpsLng').value) || 30.7503;
            updateDynamicFieldMetrics(lat, lng);
            document.getElementById('sentinelStatus').innerText = currentLang === 'ar' ? 'قمر Sentinel: تم التحديث بنجاح (L2A)' : 'Sentinel Satellite: Updated successfully (L2A)';
            showToast(currentLang === 'ar' ? '✅ تم جلب أحدث بيانات قمر Sentinel بنجاح' : '✅ Sentinel data fetched successfully', 'success');
        }, 1000);
    }

    function calculateResults() {
        const owner = document.getElementById('ownerName').value || (currentLang === 'ar' ? 'مستفيد غير محدد' : 'Unknown Owner');
        const lat = document.getElementById('gpsLat').value || '28.1099';
        const lng = document.getElementById('gpsLng').value || '30.7503';
        const diesel = parseFloat(document.getElementById('dieselInput').value) || 0;
        const fert = parseFloat(document.getElementById('fertInput').value) || 0;
        const trees = parseFloat(document.getElementById('palmCountInput').value) || 0;
        const ndvi = parseFloat(document.getElementById('ndviInput').value) || 0.45;

        const emissions = ((diesel * 2.68) + (fert * 1.35)) / 1000;
        const absorption = (trees * 0.025) + (ndvi * 12.5);
        const netCarbon = Math.max(0, absorption - emissions);
        const minRevenue = netCarbon * 18;
        const maxRevenue = netCarbon * 40;

        document.getElementById('resOwnerName').innerText = owner;
        document.getElementById('resGpsCoords').innerText = `Lat: ${lat}, Lng: ${lng}`;
        document.getElementById('resNdviVal').innerText = ndvi;
        document.getElementById('resEmissions').innerText = emissions.toFixed(2) + (currentLang === 'ar' ? ' طن مكافئ CO2' : ' Tons CO2e');
        document.getElementById('resTrees').innerText = absorption.toFixed(2) + (currentLang === 'ar' ? ' طن CO2 سنوياً' : ' Tons CO2/Year');
        document.getElementById('resNet').innerText = netCarbon.toFixed(2) + (currentLang === 'ar' ? ` طن مرصود (عائد: $${minRevenue.toFixed(0)} - $${maxRevenue.toFixed(0)})` : ` Tons (Income: $${minRevenue.toFixed(0)} - $${maxRevenue.toFixed(0)})`);

        document.getElementById('resultsArea').classList.remove('hidden');
        document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
        showToast(currentLang === 'ar' ? '🚀 تم تحليل أصول المناخ وحساب دخل الكربون بنجاح' : '🚀 Climate assets and carbon analyzed successfully', 'success');
    }

    function sendCompanyEmailReport() {
        const owner = document.getElementById('ownerName').value || 'Nilus User';
        showToast(currentLang === 'ar' ? `📧 جاري إرسال تقرير أصول المناخ لبريد الشركة الخاص بـ (${owner})...` : '📧 Sending report to company email...', 'info');
        setTimeout(() => {
            showToast(currentLang === 'ar' ? '✅ تم إرسال التقرير بنجاح إلى البريد الإلكتروني الرسمي لشركة نيلوس' : '✅ Report successfully sent to company email', 'success');
        }, 1200);
    }

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.getElementById('htmlRoot');
        html.setAttribute('lang', currentLang);
        html.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English 🇺🇸' : 'العربية 🇪🇬';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[currentLang][key]) {
                el.innerText = translations[currentLang][key];
            }
        });

        showToast(currentLang === 'ar' ? '🌐 تم التبديل إلى اللغة العربية' : '🌐 Switched to English', 'info');
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        
        let bgClass = 'bg-slate-800 border-cyan-500/40 text-cyan-300';
        if (type === 'success') bgClass = 'bg-emerald-950/90 border-emerald-500/40 text-emerald-300';
        if (type === 'error') bgClass = 'bg-red-950/90 border-red-500/40 text-red-300';

        toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-2xl text-xs font-bold transition transform translate-y-2 opacity-0 flex items-center space-x-2 space-x-reverse ${bgClass}`;
        toast.innerText = message;

        container.appendChild(toast);
        setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);

        setTimeout(() => {
            toast.classList.add('translate-y-2', 'opacity-0');
            setTimeout(() => { toast.remove(); }, 300);
        }, 3500);
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onscroll = function() {
        const btn = document.getElementById('scrollTopBtn');
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }
    };
</script>
