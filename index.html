<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نيلوس للتقنيات الرقمية وأصول المناخ | Nilus ECA</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Cairo', sans-serif;
            color: #333;
        }
        .hero-section {
            background: linear-gradient(135deg, #0f4c3a 0%, #1b7a5a 100%);
            color: white;
            padding: 50px 0;
            border-radius: 0 0 25px 25px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease;
            margin-bottom: 25px;
            background: #ffffff;
        }
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid #eaeaea;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 20px;
        }
        .btn-success-custom {
            background-color: #1b7a5a;
            border: none;
            color: white;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: background 0.3s;
        }
        .btn-success-custom:hover {
            background-color: #0f4c3a;
            color: white;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ced4da;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(27, 122, 90, 0.15);
            border-color: #1b7a5a;
        }
        .result-box {
            background: #f1f8f5;
            border: 1px dashed #1b7a5a;
            border-radius: 12px;
            padding: 25px;
        }
    </style>
</head>
<body id="calculator">

    <!-- الهيدر الرئيسي -->
    <div class="hero-section text-center">
        <div class="container">
            <h2><i class="fa-solid.fa-seedling ms-2"></i> نيلوس للتقنيات الرقمية وأصول المناخ</h2>
            <p class="lead mt-2">منصة إدارة البصمة الكربونية، وحسابات التخزين وعزل الكربون وأجهزة الـ IoT</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <!-- نموذج إدخال البيانات -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header text-success">
                        <i class="fa-solid fa-calculator ms-2"></i> حاسبة الانبعاثات والتخزين الكربوني
                    </div>
                    <div class="card-body p-4">
                        <form id="telemetryForm">
                            <div class="mb-3">
                                <label for="sensorId" class="form-label fw-semibold">معرف الحساس أو الوحدة</label>
                                <input type="text" class="form-control" id="sensorId" value="sensor_nilus_01" required>
                            </div>
                            <div class="mb-3">
                                <label for="deviceType" class="form-label fw-semibold">نوع العملية أو الجهاز</label>
                                <select class="form-select" id="deviceType" onchange="toggleInputs()">
                                    <option value="diesel_flow_meter">عداد تدفق الديزل (Diesel Flow Meter)</option>
                                    <option value="energy_meter">استهلاك الكهرباء (Energy Meter)</option>
                                    <option value="soil_management">تخزين كربون التربة وإدارة الأراضي</option>
                                </select>
                            </div>

                            <!-- حقل فرعي يظهر عند اختيار تخزين التربة -->
                            <div class="mb-3" id="subTypeContainer" style="display: none;">
                                <label for="subType" class="form-label fw-semibold">ممارسة إدارة الأراضي</label>
                                <select class="form-select" id="subType">
                                    <option value="conservation_agriculture">الزراعة الحافظة (Conservation Agriculture)</option>
                                    <option value="no_till_with_cover_crop">الزراعة بدون حرث مع غطاء نباتي</option>
                                    <option value="agroforestry">الزراعة الحراجية (Agroforestry)</option>
                                    <option value="conventional_tillage">الحرث التقليدي (Conventional Tillage)</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="metricValue" id="valueLabel" class="form-label fw-semibold">القيمة (باللتر / كيلوواط)</label>
                                <input type="number" step="0.01" class="form-control" id="metricValue" placeholder="أدخل القيمة الرقمية هنا" required>
                            </div>

                            <button type="submit" class="btn btn-success-custom w-100">
                                <i class="fa-solid fa-chart-pie ms-2"></i> تنفيذ الحساب والمعالجة
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- قسم عرض النتائج -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header text-primary">
                        <i class="fa-solid fa-file-lines ms-2"></i> مخرجات التحليل البيئي والتقارير
                    </div>
                    <div class="card-body d-flex flex-column justify-content-center p-4">
                        <div id="resultContainer" class="result-box text-center text-muted">
                            <i class="fa-solid fa-sliders fa-2x mb-3 text-success"></i>
                            <p class="mb-0">قم بإدخال البيانات واضغط على "تنفيذ الحساب" لعرض مؤشرات البصمة الكربونية وتخزين التربة فوراً.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- جافاسكريفت للتحكم بالحقول والاتصال بالـ Backend -->
    <script>
        function toggleInputs() {
            const deviceType = document.getElementById('deviceType').value;
            const subTypeContainer = document.getElementById('subTypeContainer');
            const valueLabel = document.getElementById('valueLabel');
            
            if (deviceType === 'soil_management') {
                subTypeContainer.style.display = 'block';
                valueLabel.innerText = 'المساحة بالهكتار (Area in Hectares)';
            } else {
                subTypeContainer.style.display = 'none';
                valueLabel.innerText = 'القيمة المقاسة (باللتر / كيلوواط)';
            }
        }

        document.getElementById('telemetryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sensorId = document.getElementById('sensorId').value;
            const deviceType = document.getElementById('deviceType').value;
            const value = parseFloat(document.getElementById('metricValue').value);
            const subType = document.getElementById('subType').value;
            
            const payload = {
                sensor_id: sensorId,
                device_type: deviceType,
                value: value,
                sub_type: subType
            };

            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = `<div class="spinner-border text-success" role="status"></div><p class="mt-2 text-success">جاري معالجة البيانات وفق معايير IPCC...</p>`;

            try {
                // استبدل هذا الرابط برابط السيرفر الفعلي المرفوع عليه البايثون (Backend)
                const response = await fetch('http://127.0.0.1:5000/api/v1/sensor-telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok) {
                    let resHtml = `
                        <h5 class="text-success fw-bold mb-3"><i class="fa-solid fa-circle-check"></i> تمت العملية بنجاح</h5>
                        <p class="mb-1"><strong>معرف الوحدة:</strong> ${data.sensor_id}</p>
                        <p class="mb-3"><strong>نوع الجهاز:</strong> ${data.device_type}</p>
                        <hr>
                    `;
                    
                    const res = data.processed_result;
                    if(res.type === "emission") {
                        resHtml += `
                            <p class="mb-1"><strong>إجمالي الانبعاثات:</strong> ${res.emissions_kg_co2e.toFixed(2)} كجم CO2e</p>
                            <p class="mb-1"><strong>بالطن:</strong> ${res.emissions_tonnes_co2e.toFixed(4)} طن</p>
                            <p class="mb-1"><strong>نطاق الحساب:</strong> ${res.scope}</p>
                            <p class="mb-0"><strong>المعيار:</strong> ${res.standard}</p>
                        `;
                    } else if(res.type === "storage") {
                        resHtml += `
                            <p class="mb-1"><strong>المساحة:</strong> ${res.area_hectares} هكتار</p>
                            <p class="mb-1"><strong>معدل التخزين/العزل:</strong> ${res.total_storage_t_co2e_per_year} طن سنوياً</p>
                            <p class="mb-1"><strong>الحالة:</strong> ${res.is_sequestration ? '<span class="text-success fw-bold">عزل كربوني إيجابي (Sequestration)</span>' : 'انبعاثات مرتبطة بالحرث'}</p>
                            <p class="mb-0"><strong>المعيار:</strong> ${res.standard}</p>
                        `;
                    } else {
                        resHtml += `<pre class="text-start bg-white p-2 rounded">${JSON.stringify(res, null, 2)}</pre>`;
                    }
                    
                    resultContainer.className = "result-box text-start p-4 bg-white shadow-sm";
                    resultContainer.innerHTML = resHtml;
                } else {
                    resultContainer.className = "result-box text-center text-danger";
                    resultContainer.innerHTML = `حدث خطأ: ${data.message}`;
                }
            } catch (error) {
                resultContainer.className = "result-box text-center text-danger";
                resultContainer.innerHTML = `تعذر الاتصال بالخادم الخلفي. تأكد من تشغيل ملف البايثون (Backend) وإتاحة الرابط الصحيح.`;
            }
        });
    </script>
</body>
</html>
