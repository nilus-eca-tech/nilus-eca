<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نيلوس للتقنيات الرقمية وأصول المناخ | Nilus ECA</title>
    <!-- استيراد التنسيقات والخطوط الأساسية -->
    <link href="https://cdn.jsdelivr.5net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-section {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 0;
            border-radius: 0 0 15px 15px;
            margin-bottom: 25px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: #2a5298;
            border: none;
        }
        .btn-primary:hover {
            background-color: #1e3c72;
        }
    </style>
</head>
<body>

    <!-- الهيدر البسيط -->
    <div class="hero-section text-center">
        <div class="container">
            <h2><i class="fa-solid fa-leaf"></i> نيلوس للتقنيات الرقمية وأصول المناخ</h2>
            <p class="lead mb-0">منصة إدارة الكربون وحسابات الحساسات (IoT Telemetry)</p>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <!-- قسم إدخال بيانات الحساسات -->
            <div class="col-lg-6">
                <div class="card p-4">
                    <h4 class="mb-3 text-primary"><i class="fa-solid fa-microchip"></i> إدخال بيانات الحساسات</h4>
                    <form id="telemetryForm">
                        <div class="mb-3">
                            <label for="sensorId" class="form-label">معرف الحساس (Sensor ID)</label>
                            <input type="text" class="form-control" id="sensorId" value="sensor_diesel_01" required>
                        </div>
                        <div class="mb-3">
                            <label for="deviceType" class="form-label">نوع الجهاز</label>
                            <select class="form-select" id="deviceType">
                                <option value="diesel_flow_meter">عداد تدفق الديزل (Diesel Flow Meter)</option>
                                <option value="energy_meter">عداد استهلاك الكهرباء (Energy Meter)</option>
                                <option value="soil_sensor">حساس رطوبة التربة (Soil Sensor)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="metricValue" class="form-label">القيمة المقاسة</label>
                            <input type="number" step="0.01" class="form-control" id="metricValue" placeholder="أدخل القيمة هنا" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">إرسال وتحليل البيانات</button>
                    </form>
                </div>
            </div>

            <!-- قسم عرض النتائج -->
            <div class="col-lg-6">
                <div class="card p-4 h-100">
                    <h4 class="mb-3 text-success"><i class="fa-solid fa-chart-line"></i> النتائج والمعالجة</h4>
                    <div id="resultContainer" class="alert alert-secondary text-center py-5">
                        قم بإرسال قراءة من الحساس لعرض النتائج هنا...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('telemetryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sensorId = document.getElementById('sensorId').value;
            const deviceType = document.getElementById('deviceType').value;
            const value = parseFloat(document.getElementById('metricValue').value);
            
            const payload = {
                sensor_id: sensorId,
                device_type: deviceType,
                value: value
            };

            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = `<div class="spinner-border text-primary" role="status"></div><p class="mt-2">جاري المعالجة...</p>`;

            try {
                const response = await fetch('http://127.0.0.1:5000/api/v1/sensor-telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok) {
                    let resHtml = `
                        <h5 class="text-success">تمت المعالجة بنجاح</h5>
                        <p><strong>معرف الحساس:</strong> ${data.sensor_id}</p>
                        <p><strong>نوع الجهاز:</strong> ${data.device_type}</p>
                        <hr>
                    `;
                    
                    if(data.processed_result.emissions_kg_co2e !== undefined) {
                        resHtml += `
                            <p><strong>الانبعاثات (كجم CO2e):</strong> ${data.processed_result.emissions_kg_co2e.toFixed(2)}</p>
                            <p><strong>الانبعاثات (طن CO2e):</strong> ${data.processed_result.emissions_tonnes_co2e.toFixed(4)}</p>
                            <p><strong>النطاق:</strong> ${data.processed_result.scope}</p>
                        `;
                    } else {
                        resHtml += `<pre class="text-start bg-light p-2 rounded">${JSON.stringify(data.processed_result, null, 2)}</pre>`;
                    }
                    
                    resultContainer.className = "alert alert-success text-start";
                    resultContainer.innerHTML = resHtml;
                } else {
                    resultContainer.className = "alert alert-danger text-center";
                    resultContainer.innerHTML = `خطأ: ${data.message}`;
                }
            } catch (error) {
                resultContainer.className = "alert alert-danger text-center";
                resultContainer.innerHTML = `تعذر الاتصال بالخادم. تأكد من تشغيل السيرفر المحلي.`;
            }
        });
    </script>
</body>
</html>
